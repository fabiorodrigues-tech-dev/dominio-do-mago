spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dominiodomago
    username: nexus
    password: nexus123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-on-validation-error: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 50MB

  ai:
    google:
      gemini:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.8-flash

server:
  port: 8080

tripo3d:
  # Chave de API da Tripo3D. Exporte no terminal: export TRIPO3D_API_KEY=tsk_...
  api-key: ${TRIPO3D_API_KEY:mock_key_for_compilation}

